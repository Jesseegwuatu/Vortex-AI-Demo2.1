/* ---------- 8. Markdown ---------- */
function inlineMd(t){
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  return t;
}
function mdLite(raw){
  const lines = raw.split('\n');
  let html = '', listT = null, inQ = false;
  const closeList = () => { if(listT){ html += listT==='ul'?'</ul>':'</ol>'; listT = null; } };
  const closeQ = () => { if(inQ){ html += '</blockquote>'; inQ = false; } };
  lines.forEach(line => {
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    const q = line.match(/^\s*>\s?(.*)$/);
    if(h){ closeList(); closeQ(); const l = h[1].length; html += `<div class="md-h${l}">${inlineMd(esc(h[2]))}</div>`; }
    else if(ul){ closeQ(); if(listT!=='ul'){ closeList(); html+='<ul>'; listT='ul'; } html += `<li>${inlineMd(esc(ul[1]))}</li>`; }
    else if(ol){ closeQ(); if(listT!=='ol'){ closeList(); html+='<ol>'; listT='ol'; } html += `<li>${inlineMd(esc(ol[1]))}</li>`; }
    else if(q){ closeList(); if(!inQ){ html+='<blockquote>'; inQ=true; } html += `${inlineMd(esc(q[1]))}<br>`; }
    else if(line.trim()===''){ closeList(); closeQ(); html+='<div class="md-sp"></div>'; }
    else { closeList(); closeQ(); html += `<div class="md-p">${inlineMd(esc(line))}</div>`; }
  });
  closeList(); closeQ();
  return html;
}
function formatMd(raw){
  if(!raw) return '';
  const re = /```(\w*)\n?([\s\S]*?)```/g;
  const parts = []; let last = 0, m;
  while((m = re.exec(raw)) !== null){
    if(m.index > last) parts.push({t:'text', c: raw.slice(last, m.index)});
    parts.push({t:'code', lang:(m[1]||'plaintext').toLowerCase(), code:m[2].replace(/\n$/,'')});
    last = re.lastIndex;
  }
  if(last < raw.length) parts.push({t:'text', c: raw.slice(last)});
  return parts.map(p => {
    if(p.t === 'text') return mdLite(p.c);
    const ext = CODE_EXT[p.lang] || 'txt';
    const b64 = (() => { try{ return btoa(unescape(encodeURIComponent(p.code))); }catch(e){ return ''; } })();
    return `<div class="code"><div class="code-head"><span class="code-lang">${p.lang}</span><div class="code-btns"><button class="code-btn copy-code" data-code="${encodeURIComponent(p.code)}"><i class="fas fa-copy"></i> Copy</button><button class="code-btn dl-code" data-b64="${b64}" data-ext="${ext}"><i class="fas fa-download"></i> .${ext}</button></div></div><pre><code class="language-${p.lang}">${esc(p.code)}</code></pre></div>`;
  }).join('');
}
function wireCode(container){
  container.querySelectorAll('.copy-code').forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(decodeURIComponent(b.dataset.code));
    const o = b.innerHTML; b.innerHTML = '<i class="fas fa-check"></i> Copied';
    setTimeout(() => b.innerHTML = o, 1500);
  });
  container.querySelectorAll('.dl-code').forEach(b => b.onclick = () => {
    if(!b.dataset.b64) return;
    let code = ''; try{ code = decodeURIComponent(escape(atob(b.dataset.b64))); }catch(e){ return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], {type:'text/plain'})); a.download = `snippet.${b.dataset.ext}`; a.click();
  });
}

/* ---------- 9. Voice synth ---------- */
function pickVoice(gender){
  if(!window.speechSynthesis) return null;
  const vs = window.speechSynthesis.getVoices(); if(!vs.length) return null;
  const en = vs.filter(v => v.lang && v.lang.startsWith('en'));
  const pool = en.length ? en : vs;
  return pool.find(v => gender==='male' ? /male|david|mark|guy|daniel/i.test(v.name) : /female|zira|susan|samantha|victoria|karen/i.test(v.name)) || pool[0];
}
function speak(text, onEnd){
  if(!text || isMuted || !window.speechSynthesis){ if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const clean = text.replace(/```[\s\S]*?```/g, ' (code shown on screen) ').replace(/[#*_`>[\]()]/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  const v = VOICES.find(x => x.name === selectedVoice);
  if(v){ u.pitch = v.pitch; u.rate = v.rate; const sv = pickVoice(v.gender); if(sv) u.voice = sv; }
  if(onEnd){ u.onend = onEnd; u.onerror = onEnd; }
  window.speechSynthesis.speak(u);
}
function stopSpeak(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); }
function sampleVoice(name){
  if(!window.speechSynthesis) return;
  const v = VOICES.find(x => x.name === name); if(!v) return;
  const u = new SpeechSynthesisUtterance(`Hi, I'm ${name}. This is how I sound.`);
  u.pitch = v.pitch; u.rate = v.rate; const sv = pickVoice(v.gender); if(sv) u.voice = sv;
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
}

function editMsg(id, el){

function delMsg(id, el){

/* ---------- 11. Chat list ---------- */
const chatList = $('chatList');
function renderChatList(q=''){
  const filtered = q ? allChats.filter(c => (c.title||'').toLowerCase().includes(q.toLowerCase())) : allChats;
  const regular = filtered.filter(c => !c.temp);
  const temp = filtered.filter(c => c.temp);
  let html = '';
  if(regular.length){
    html += `<div class="chat-sec">Chats</div>`;
    html += regular.map(c => chatRow(c)).join('');
  }
  if(temp.length){
    html += `<div class="chat-sec">Temporary (30 days)</div>`;
    html += temp.map(c => chatRow(c)).join('');
  }
  if(!html) html = `<div style="text-align:center;padding:2rem;color:var(--ink-3);font-size:.78rem;">${q?'No chats found':'No chats yet'}</div>`;
  chatList.innerHTML = html;
  chatList.querySelectorAll('.chat-item').forEach(r => r.onclick = e => { if(e.target.closest('.ci-btn')) return; loadChat(r.dataset.id); });
  chatList.querySelectorAll('.ci-btn.pin').forEach(b => b.onclick = e => { e.stopPropagation(); togglePin(b.dataset.id); });
  chatList.querySelectorAll('.ci-btn.del').forEach(b => b.onclick = e => { e.stopPropagation(); delChat(b.dataset.id); });
}
function chatRow(c){
  const active = c.id === currentChatId ? 'active' : '';
  const pin = c.pinned ? 'pinned' : '';
  const temp = c.temp ? 'temp' : '';
  const icon = c.temp ? 'fa-clock' : 'fa-comment';
  const daysLeft = c.temp && c.expiresAt ? Math.max(0, Math.ceil((c.expiresAt - Date.now()) / 86400000)) + 'd' : (c.messageCount||0) + ' msgs';
  return `<div class="chat-item ${active} ${pin} ${temp}" data-id="${c.id}">
    <div class="ci-icon"><i class="fas ${icon}"></i></div>
    <div class="ci-body"><div class="ci-title">${esc(c.title||'New chat')}</div><div class="ci-sub">${daysLeft}</div></div>
    <div class="ci-acts">
      <button class="ci-btn pin ${c.pinned?'on':''}" data-id="${c.id}" title="Pin"><i class="fas fa-thumbtack"></i></button>
      <button class="ci-btn del" data-id="${c.id}" title="Delete"><i class="fas fa-trash"></i></button>
    </div>
  </div>`;
}
async function togglePin(id){
  const c = allChats.find(x => x.id === id); if(!c) return;
  await Store.updateChat(id, { pinned: !c.pinned });
  toast(!c.pinned ? 'Pinned' : 'Unpinned', 'success');
}
async function delChat(id){
  if(!confirm('Delete this chat permanently?')) return;
  await Store.deleteChat(id);
  if(currentChatId === id){
    currentChatId = null;
    const next = allChats.find(c => c.id !== id);
    if(next) loadChat(next.id); else await createChat();
  }
  toast('Deleted', 'info');
}

/* ---------- 12. Chat lifecycle ---------- */
async function ensureChat(){
  if(currentChatId) return currentChatId;
  currentChatId = await Store.createChat();
  currentMessages = [];
  currentChatMeta = { id: currentChatId };
  return currentChatId;
}
async function createChat(opts={}){
  const id = await Store.createChat(opts);
  currentChatId = id;
  currentMessages = [];
  currentChatMeta = { id };
  $('chatTitle').textContent = opts.temp ? 'Temporary chat' : 'New chat';
  clearChat(); showWelcome();
  closeSidebar();
  return id;
}
async function loadChat(id){
  currentChatId = id;
  stopSpeak();
  currentChatMeta = allChats.find(c => c.id === id) || { id };
  currentMessages = await Store.listMessages(id);
  $('chatTitle').textContent = currentChatMeta.title || 'Chat';
  renderAll();
  renderChatList($('searchChats').value);
  closeSidebar();
}
function onChats(chats){
  allChats = chats.slice().sort((a,b) => {
    if(a.pinned !== b.pinned) return (b.pinned?1:0) - (a.pinned?1:0);
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  renderChatList($('searchChats').value);
  updateStats();
  if(!currentChatId && allChats.length) loadChat(allChats[0].id);
}

async function saveMsg(role, content, img=null){
  await ensureChat();
  const msg = { role, content, timestamp: Date.now() };
  if(img) msg.imageUrl = img;
  try{
    const id = await Store.addMessage(currentChatId, msg);
    msg.id = id;
    currentMessages.push(msg);
    const patch = { messageCount: currentMessages.length, updatedAt: Date.now() };
    if(role === 'user' && currentMessages.filter(m => m.role === 'user').length === 1){
      patch.title = content.substring(0,42) + (content.length > 42 ? '…' : '');
    }
    await Store.updateChat(currentChatId, patch);
    if(patch.title) $('chatTitle').textContent = patch.title;
    return id;
  }catch(e){
    console.warn('saveMsg failed (will still call API)', e);
    msg.id = 'local_' + Date.now();
    currentMessages.push(msg);
    return msg.id;
  }
}

/* ---------- 13. Cross-chat memory ---------- */
async function memory(){
  let ctx = '';
  const others = allChats.filter(c => c.id !== currentChatId && !c.temp).slice(0, 4);
  for(const c of others){
    const msgs = await Store.listMessages(c.id);
    msgs.slice(-3).forEach(m => { ctx += `[In "${c.title||'a chat'}", ${m.role}: ${(m.content||'').substring(0,180)}]\n`; });
  }
  currentMessages.slice(-6).forEach(m => { ctx += `[${m.role}: ${(m.content||'').substring(0,250)}]\n`; });
  return ctx;
}

/* ---------- 14. System prompt builder ---------- */
function systemPrompt(){
  let p = IDENTITY;
  const name = ($('inName').value || '').trim();
  const info = ($('inAbout').value || '').trim();
  if(name || info){
    p += `\n\nAbout the user:`;
    if(name) p += `\n- Name: ${name}. Use it naturally.`;
    if(info) p += `\n- Context: "${info}". Tailor answers to this.`;
  }
  const styles = {
    concise: 'Keep replies short unless asked for depth.',
    balanced: 'Give complete, organized answers without padding.',
    detailed: 'Be thorough — explain reasoning and add useful context.'
  };
  p += `\n\nReply length: ${styles[responseStyle] || styles.balanced}`;
  return p;
}

/* ---------- 15. API ---------- */
function setSendState(active){
  isResponding = active;
  const btn = $('sendBtn');
  btn.classList.toggle('stop', active);
  btn.innerHTML = active ? '<i class="fas fa-stop"></i>' : '<i class="fas fa-arrow-up"></i>';
  btn.title = active ? 'Stop' : 'Send';
}

async function callAPI(prompt, fileB64, mime, mem){
  abortCtl = new AbortController();

  // IMPORTANT: send `model: selectedModel` (frontend ID like 'vortex-smart'),
  // NOT model.model. Backend resolves it via MODEL_MAP.
  const body = {
    message: prompt,
    system: systemPrompt(),
    model: selectedModel,
    style: responseStyle,
    temperature: creativityLevel / 100,
    memory: mem,
    image: fileB64 ? { data: fileB64, mimeType: mime } : null
  };

  const debug = {
    url: '/api/chat',
    bodyKeys: Object.keys(body),
    bodyModel: body.model,
    bodyMessageLen: (body.message||'').length,
    status: null,
    ok: false,
    err: null,
    responsePreview: null
  };
  LAST_API_DEBUG = debug;

  try{
    const timer = setTimeout(() => abortCtl.abort(), 60000);
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: abortCtl.signal
    });
    clearTimeout(timer);
    debug.status = res.status;
    debug.ok = res.ok;

    if(!res.ok){
      let errData = {};
      try{ errData = await res.json(); }catch(e){}
      debug.err = errData.error || ('HTTP ' + res.status);
      debug.responsePreview = JSON.stringify(errData).slice(0, 300);

      // Surface to the user so they KNOW what went wrong
      if(res.status === 404){
        toast('Backend not found at /api/chat — is it deployed?', 'error', 6000);
      } else if(res.status === 405){
        toast('Backend got wrong method (check api/chat.js)', 'error', 6000);
      } else if(res.status === 503){
        toast('AI busy — try again shortly', 'warn', 4000);
      } else {
        toast('API error ' + res.status + ' — see console', 'error', 5000);
      }

      if(errData.fallbackMessage) return errData.fallbackMessage;
      throw new Error(errData.error || ('HTTP ' + res.status));
    }

    const data = await res.json();
    debug.responsePreview = JSON.stringify(data).slice(0, 300);

    if(data.choices?.[0]?.message?.content){
      return data.choices[0].message.content;
    }
    if(data.content) return data.content;
    if(data.reply) return data.reply;
    throw new Error('Empty response from backend');
  }catch(err){
    debug.err = err.message;
    if(err.name === 'AbortError'){
      toast('Cancelled', 'info');
      return null;
    }
    console.error('[Vortex API] failure:', debug);
    return `I couldn't reach the Vortex backend (${err.message}). Your message was saved to your cloud session — please try again in a moment.`;
  }finally{
    abortCtl = null;
  }
}

async function requestResponse(prompt, file, voiceMode){
  const mem = await memory();
  showTyping(); setSendState(true);
  if(voiceMode) setVoiceState('thinking', 'Thinking…');
  const reply = await callAPI(prompt, file?.base64, file?.mime, mem);
  hideTyping(); setSendState(false);
  if(reply === null){ if(voiceMode) closeVoice(); return; }
  const id = await saveMsg('assistant', reply);
  renderBot(reply, id, true);
  scrollBottom();
  if(voiceMode){
    setVoiceState('speaking', 'Speaking…');
    speak(reply, () => { if(voiceOn) startListening(); });
  } else if(autoSpeakOn && !isMuted) speak(reply);
}

/* ---------- 16. Send ---------- */
async function sendMessage(explicit){
  if(isResponding){ toast('Still replying — tap stop first', 'info'); return; }
  const text = (explicit || $('userInput').value || '').trim();
  if(!text && !pendingFile) return;

  if(text && !pendingFile && isImageRequest(text)){
    $('userInput').value = ''; $('userInput').style.height = 'auto';
    await runImageGen(text);
    return;
  }

  await ensureChat();
  const w = document.querySelector('.welcome'); if(w) w.remove();

  const file = pendingFile;
  const imgUrl = file ? `data:${file.mime};base64,${file.base64}` : null;

  // Render optimistically BEFORE persistence
  renderUser(text || 'Analyzing attachment', imgUrl, null);
  $('userInput').value = ''; $('userInput').style.height = 'auto';
  pendingFile = null; $('filePreview').innerHTML = '';
  scrollBottom();

  await saveMsg('user', text || 'Analyzing attachment', imgUrl);
  await requestResponse(text || 'Describe this attachment', file, false);
}

async function regenLast(id){
  if(isResponding){ toast('Wait for the current reply', 'info'); return; }
  const last = currentMessages[currentMessages.length-1];
  if(!last || last.role !== 'assistant' || last.id !== id){ toast('Only the latest reply can be regenerated', 'info'); return; }
  const lastUser = [...currentMessages].reverse().find(m => m.role === 'user');
  if(!lastUser){ toast('Nothing to regenerate', 'info'); return; }
  await Store.deleteMessage(currentChatId, last.id);
  currentMessages.pop();
  const el = chatInner.querySelector(`[data-mid="${last.id}"]`); if(el) el.remove();
  await requestResponse(lastUser.content, null, false);
}

/* ---------- 17. Image generation ---------- */
async function runImageGen(basePrompt, style){
  const full = style ? `${basePrompt}, ${style.toLowerCase()} style` : basePrompt;
  await ensureChat();
  const w = document.querySelector('.welcome'); if(w) w.remove();
  renderUser(`Generate an image: ${full}`, null, null);
  await saveMsg('user', `Generate an image: ${full}`);
  showTyping();
  const seed = Date.now();
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(full)}?width=1024&height=1024&seed=${seed}&nologo=true`;
  const probe = new Image();
  probe.onload = async () => {
    hideTyping();
    const id = await saveMsg('assistant', `Generated image for: ${full}`, url);
    renderImageMsg(full, url, id);
    scrollBottom();
  };
  probe.onerror = async () => {
    hideTyping();
    const msg = "I couldn't generate that image right now — try again in a moment.";

/* ---------- 19. Voice mode ---------- */
let audioCtx = null, analyser = null, micStream = null, waveRAF = null;
async function startWave(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 64; src.connect(analyser);
    drawWave();
  }catch(e){ console.warn('Mic wave failed', e.message); }
}
function drawWave(){
  if(!analyser) return;
  const d = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(d);
  const avg = d.reduce((a,b) => a+b, 0) / d.length;
  const sc = 1 + Math.min(avg/90, .55);
  if($('orbCore') && $('orb').classList.contains('listening')) $('orbCore').style.transform = `scale(${sc})`;
  waveRAF = requestAnimationFrame(drawWave);
}
function stopWave(){
  if(waveRAF) cancelAnimationFrame(waveRAF); waveRAF = null;
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx = null; }
  analyser = null; if($('orbCore')) $('orbCore').style.transform = '';
}
function getRecognizer(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR(); r.lang = 'en-US'; r.interimResults = true; r.continuous = false;
  return r;
}
function setVoiceState(s, label){ $('orb').className = 'orb ' + s; $('voiceStatus').textContent = label; }
function openVoice(){
  if(!(window.SpeechRecognition || window.webkitSpeechRecognition)){ toast('Voice needs Chrome/Edge/Safari', 'error'); return; }
  voiceOn = true; $('voiceOverlay').classList.add('show'); $('voiceBtn').classList.add('on');
  const w = document.querySelector('.welcome'); if(w) w.remove();
  startWave(); startListening();
}
function closeVoice(){
  voiceOn = false;
  if(recognizer){ try{ recognizer.stop(); }catch(e){} recognizer = null; }
  stopSpeak(); stopWave();
  $('voiceOverlay').classList.remove('show'); $('voiceBtn').classList.remove('on');
}
function startListening(){
  if(!voiceOn || voiceMicMuted) return;
  setVoiceState('listening', 'Listening…');
  $('voiceText').textContent = '';
  recognizer = getRecognizer(); if(!recognizer) return;
  let finalTxt = '';
  recognizer.onresult = ev => {
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      if(ev.results[i].isFinal) finalTxt += ev.results[i][0].transcript;
      else interim += ev.results[i][0].transcript;
    }
    $('voiceText').textContent = (finalTxt + ' ' + interim).trim();
  };
  recognizer.onend = async () => {
    if(!voiceOn) return;
    const spoken = finalTxt.trim();
    if(spoken){
      $('voiceText').textContent = spoken;
      if(isImageRequest(spoken)){
        await ensureChat();
        await saveMsg('user', spoken);
        await runImageGen(spoken);
        if(voiceOn) startListening();
        return;
      }
      await ensureChat();
      await saveMsg('user', spoken);
      await requestResponse(spoken, null, true);
    } else { startListening(); }
  };
  recognizer.onerror = e => {
    if(e.error === 'no-speech' || e.error === 'aborted'){ if(voiceOn) startListening(); return; }
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ toast('Mic denied', 'error'); closeVoice(); return; }
    if(voiceOn) startListening();
  };
  try{ recognizer.start(); }catch(e){}
}

/* ---------- 21. File handling ---------- */
function handleFile(file){
  if(!file) return;
  const ok = ['image/jpeg','image/png','image/webp','image/gif','application/pdf'];
  if(!ok.includes(file.type)){ toast('Unsupported file type', 'error'); return; }
  if(file.size > 12*1024*1024){ toast('Max 12MB', 'error'); return; }
  const r = new FileReader();
  r.onload = e => {
    const b64 = e.target.result.split(',')[1];
    pendingFile = { base64:b64, mime:file.type, name:file.name };
    const isImg = file.type.startsWith('image/');
    $('filePreview').innerHTML = `<div class="file-chip">${isImg ? `<img src="data:${file.type};base64,${b64}">` : `<i class="fas fa-file-lines" style="color:var(--accent-2);width:32px;text-align:center;"></i>`}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(file.name)}</span><button class="file-x" id="fileX"><i class="fas fa-times"></i></button></div>`;
    $('fileX').onclick = () => { pendingFile = null; $('filePreview').innerHTML = ''; $('fileInput').value = ''; };
  };
  r.readAsDataURL(file);
}

  $('settingsModal').classList.add('open');
  renderThemeGrid(); renderVoiceList();
  $('inName').value = $('pName').textContent === 'Guest' ? '' : $('pName').textContent;
  $('dataStatus').textContent = 'Cloud sync active.';
}
function closeSettings(){ $('settingsModal').classList.remove('open'); }
function openProfile(){
  $('profileModal').classList.add('open');
  $('profileName').textContent = $('pName').textContent;
  $('profileSub').textContent = 'Cloud session';
  updateStats(); updateProfileSnapshot();
}
function closeProfile(){ $('profileModal').classList.remove('open'); }

/* ---------- 23. Sidebar ---------- */
function openSidebar(){ $('sidebar').classList.add('open'); $('scrim').classList.add('open'); }
function closeSidebar(){ $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); }

/* ---------- 24. Event wiring ---------- */
document.addEventListener('DOMContentLoaded', () => {
  // Sidebar
  $('menuBtn').onclick = openSidebar;
  $('scrim').onclick = closeSidebar;
  $('newChatBtn').onclick = () => createChat();
  $('searchChats').oninput = e => renderChatList(e.target.value);
  $('profileBtn').onclick = openProfile;
  $('profileClose').onclick = closeProfile;
  $('profileEditBtn').onclick = () => { closeProfile(); openSettings(); };
  $('profileModal').onclick = e => { if(e.target === $('profileModal')) closeProfile(); };
  $('settingsBtn').onclick = openSettings;
  $('settingsClose').onclick = closeSettings;
  $('settingsModal').onclick = e => { if(e.target === $('settingsModal')) closeSettings(); };

  // Model menu
  $('modelPill').onclick = e => { e.stopPropagation(); $('modelMenu').classList.toggle('open'); $('modelPill').classList.toggle('open'); };
  document.addEventListener('click', e => {
    if(!$('modelPill').contains(e.target) && !$('modelMenu').contains(e.target)){
      $('modelMenu').classList.remove('open'); $('modelPill').classList.remove('open');
    }
    if(!$('toolMenu').contains(e.target) && !$('plusBtn').contains(e.target)){
      closeToolMenu();
    }
  });

  // Mute + export
  $('muteBtn').onclick = () => {
    isMuted = !isMuted;
    $('muteBtn').classList.toggle('on', isMuted);
    $('muteBtn').innerHTML = isMuted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    if(isMuted) stopSpeak();
  };
  $('exportBtn').onclick = () => $('exportModal').classList.add('open');
  $('exportClose').onclick = () => $('exportModal').classList.remove('open');
  $('exportModal').onclick = e => { if(e.target === $('exportModal')) $('exportModal').classList.remove('open'); };
  $('expTxt').onclick = () => { exportTxt(); $('exportModal').classList.remove('open'); };
  $('expMd').onclick = () => { exportMd(); $('exportModal').classList.remove('open'); };
  $('expCopy').onclick = () => { copyAll(); $('exportModal').classList.remove('open'); };

  // Composer
  $('sendBtn').onclick = () => { if(isResponding){ if(abortCtl) abortCtl.abort(); } else sendMessage(); };
  $('voiceBtn').onclick = () => voiceOn ? closeVoice() : openVoice();
  $('voiceExit').onclick = closeVoice;
  $('voiceMute').onclick = () => {
    voiceMicMuted = !voiceMicMuted;
    $('voiceMute').classList.toggle('muted', voiceMicMuted);
    $('voiceMute').innerHTML = voiceMicMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
    if(voiceMicMuted){ if(recognizer){ try{ recognizer.stop(); }catch(e){} } setVoiceState('', 'Mic muted'); }
    else startListening();
  };

  // Plus tool menu
  $('plusBtn').onclick = e => { e.stopPropagation(); toolMenuOpen ? closeToolMenu() : openToolMenu(); };
  $('toolMenu').querySelectorAll('.tool-item').forEach(el => {
    el.onclick = () => {
      const tool = el.dataset.tool;
      closeToolMenu();
      if(tool === 'upload'){ $('fileInput').accept = 'image/*'; $('fileInput').click(); }
      else if(tool === 'file'){ $('fileInput').accept = '.pdf,application/pdf'; $('fileInput').click(); }
      else if(tool === 'image'){ toast('Type a description to generate an image', 'info'); $('userInput').focus(); }
      else if(tool === 'smart'){ selectedModel = 'vortex-smart'; $('modelLabel').textContent = 'Smart'; toast('Smart Vortex activated', 'success'); }
    };
  });
  $('fileInput').onchange = e => handleFile(e.target.files[0]);

  // @ plugin autocomplete
  const input = $('userInput');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    const v = input.value;
    const m = v.match(/@(\w*)$/);
    if(m) renderPluginPop(m[1]);
    else $('pluginPop').classList.remove('open');
  });
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){
      if($('pluginPop').classList.contains('open')){
        const sel = $('pluginPop').querySelector('.plug-item.sel') || $('pluginPop').querySelector('.plug-item');
        if(sel){ e.preventDefault(); sel.click(); return; }
      }
      e.preventDefault(); sendMessage();
    }
    if(e.key === 'Escape'){ $('pluginPop').classList.remove('open'); }
  });

  // Drop + paste
  ['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('drop', e => { e.preventDefault(); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  document.addEventListener('paste', e => {
    if(document.activeElement !== input) return;
    const items = e.clipboardData?.items; if(!items) return;
    for(const it of items){ if(it.type.startsWith('image/')){ const f = it.getAsFile(); if(f){ handleFile(f); toast('Image pasted', 'success'); } } }
  });

  // Image viewer
  $('viewerClose').onclick = closeViewer;
  $('viewer').onclick = e => { if(e.target === $('viewer')) closeViewer(); };
  $('zoomIn').onclick = () => { vZoom = Math.min(5, vZoom + .35); applyViewer(); };
  $('zoomOut').onclick = () => { vZoom = Math.max(.4, vZoom - .35); applyViewer(); };
  $('zoomReset').onclick = () => { vZoom = 1; vPanX = 0; vPanY = 0; applyViewer(); };
  $('imgSave').onclick = async () => {
    try{
      const res = await fetch($('viewerImg').src);
      const blob = await res.blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `vortex-${Date.now()}.jpg`; a.click();
      toast('Saved', 'success');
    }catch(e){ window.open($('viewerImg').src, '_blank'); }
  };
  $('imgShare').onclick = async () => {
    try{
      if(navigator.share){
        const res = await fetch($('viewerImg').src);
        const blob = await res.blob();
        await navigator.share({ title:'Vortex image', files:[new File([blob], 'vortex.jpg', {type:blob.type})] });
      } else { await navigator.clipboard.writeText($('viewerImg').src); toast('Link copied', 'success'); }
    }catch(e){ toast('Share unavailable', 'info'); }
  };
  $('viewerImg').onclick = () => { if(vZoom === 1){ vZoom = 2; applyViewer(); } else { vZoom = 1; vPanX = 0; vPanY = 0; applyViewer(); } };
  $('viewerImg').addEventListener('pointerdown', e => { if(vZoom <= 1) return; vDragging = true; vStartX = e.clientX - vPanX; vStartY = e.clientY - vPanY; $('viewerImg').setPointerCapture(e.pointerId); });
  $('viewerImg').addEventListener('pointermove', e => { if(!vDragging) return; vPanX = e.clientX - vStartX; vPanY = e.clientY - vStartY; applyViewer(); });
  $('viewerImg').addEventListener('pointerup', () => vDragging = false);

  // Settings controls
  $('styleSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
    responseStyle = b.dataset.s;
    $('styleSeg').querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
  });
  $('creativity').oninput = () => { creativityLevel = +$('creativity').value; $('creativityVal').textContent = creativityLevel + '%'; };
  $('saveSettings').onclick = async () => {
    autoSpeakOn = $('autoSpeak').checked;
    await Store.setProfile({
      displayName: $('inName').value,
      personalInfo: $('inAbout').value,
      selectedVoice, selectedModel,
      autoSpeak: autoSpeakOn,
      responseStyle, creativity: creativityLevel,
      theme, updatedAt: Date.now()
    });
    $('pName').textContent = $('inName').value || 'Guest';
    updateProfileSnapshot();
    closeSettings();
    toast('Saved to cloud', 'success');
  };
  $('clearData').onclick = async () => {
    if(!confirm('Permanently delete all chats and profile?')) return;
    await Store.wipe();
    toast('Cleared', 'info');
    setTimeout(() => location.reload(), 700);
  };

  // Keyboard
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if(mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSidebar(); $('searchChats').focus(); }
    else if(mod && e.key.toLowerCase() === 'n'){ e.preventDefault(); createChat(); }
    else if(e.key === 'Escape'){
      if($('viewer').classList.contains('show')) closeViewer();
      else if(voiceOn) closeVoice();
      else if($('settingsModal').classList.contains('open')) closeSettings();
      else if($('profileModal').classList.contains('open')) closeProfile();
      else if($('sidebar').classList.contains('open')) closeSidebar();
    }
  });
});

/* ---------- 25. Export ---------- */
function exportTxt(){
  if(!currentChatId) return;
  let c = `Vortex AI Chat\n${new Date().toLocaleString()}\n${'='.repeat(40)}\n\n`;
  currentMessages.forEach(m => c += `[${m.role.toUpperCase()}] (${new Date(m.timestamp).toLocaleString()}):\n${m.content}\n\n`);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type:'text/plain'})); a.download = `vortex_${currentChatId}.txt`; a.click();
}
function exportMd(){
  if(!currentChatId) return;
  let c = `# Vortex AI Chat\n_${new Date().toLocaleString()}_\n\n---\n\n`;
  currentMessages.forEach(m => c += `**${m.role==='user'?'You':'Vortex'}:**\n\n${m.content}\n\n---\n\n`);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type:'text/markdown'})); a.download = `vortex_${currentChatId}.md`; a.click();
}
function copyAll(){
  if(!currentMessages.length){ toast('Nothing to copy', 'info'); return; }
  navigator.clipboard.writeText(currentMessages.map(m => `${m.role==='user'?'You':'Vortex'}: ${m.content}`).join('\n\n'));
  toast('Copied', 'success');
}

/* ---------- 26. Boot ---------- */
function hideSplash(){
  if(splashHidden) return;
  splashHidden = true;
  $('splash').style.opacity = '0';
  setTimeout(() => { $('splash').style.display = 'none'; $('app').style.opacity = '1'; }, 450);
}
$('splashRetry').onclick = hideSplash;

async function boot(){
  const hard = setTimeout(() => $('splashRetry').classList.add('show'), 6000);
  $('splashStatus').textContent = 'Connecting to cloud…';
  try{
    await Store.init();
  }catch(e){
    clearTimeout(hard);
    $('splashStatus').textContent = 'Cloud unavailable: ' + e.message;
    $('splashRetry').classList.add('show');
    $('splashRetry').textContent = 'Retry';
    $('splashRetry').onclick = () => location.reload();
    setTimeout(hideSplash, 5000);
    return;
  }
  clearTimeout(hard); $('splashRetry').classList.remove('show');
  $('splashStatus').textContent = 'Syncing profile…';
  try{
    const prof = await Store.getProfile();
    if(prof){
      $('inName').value = prof.displayName || '';
      $('inAbout').value = prof.personalInfo || '';
      selectedVoice = prof.selectedVoice || 'Jesse';
      selectedModel = prof.selectedModel || 'vortex-nova';
      autoSpeakOn = !!prof.autoSpeak;
      responseStyle = prof.responseStyle || 'balanced';
      creativityLevel = typeof prof.creativity === 'number' ? prof.creativity : 50;
      theme = prof.theme || 'default';
    } else {
      await Store.setProfile({ displayName:'', personalInfo:'', selectedVoice:'Jesse', selectedModel:'vortex-nova', autoSpeak:false, responseStyle:'balanced', creativity:50, theme:'default', createdAt:Date.now() });
    }
    applyTheme(theme, false);
    $('autoSpeak').checked = autoSpeakOn;
    $('styleSeg').querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.s === responseStyle));
    $('creativity').value = creativityLevel; $('creativityVal').textContent = creativityLevel + '%';
    const m = MODELS.find(x => x.id === selectedModel) || MODELS[0];
    $('modelLabel').textContent = m.short; $('voiceModel').textContent = m.name;
    $('pName').textContent = $('inName').value || 'Guest';
    $('pSub').textContent = 'Cloud sync active';
    $('syncBadge').className = 'sync'; $('syncBadge').innerHTML = '<i class="fas fa-cloud"></i> Synced';
    renderModelMenu(); renderThemeGrid(); renderVoiceList();
    Store.watchChats(onChats);
  }catch(e){
    console.warn('Load error:', e);
    toast('Data load hiccup — starting fresh', 'error');
  }
  hideSplash();
}
setTimeout(hideSplash, 10000);
window.addEventListener('load', boot);
if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};
console.log('%cVortex AI v6', 'color:#8b93ff;font-size:15px;font-weight:bold;', '— diagnostics enabled');
</script>
